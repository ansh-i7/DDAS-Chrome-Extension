<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DDAS Dashboard</title>
  <style>
    body { width: 320px; font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f6f8; }
    
    /* Header */
    .header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
    .header h2 { margin: 0; font-size: 16px; }
    
    /* Stats Bar */
    .stats { display: flex; justify-content: space-around; background: white; padding: 10px; border-bottom: 1px solid #ddd; }
    .stat-box { text-align: center; }
    .stat-num { display: block; font-weight: bold; font-size: 18px; color: #2980b9; }
    .stat-label { font-size: 10px; color: #7f8c8d; text-transform: uppercase; }

    /* List Container */
    #list { max-height: 350px; overflow-y: auto; padding: 10px; }
    .empty { text-align: center; color: #aaa; padding: 20px; font-size: 13px; }

    /* Card Item */
    .card { background: white; border-radius: 6px; padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border-left: 4px solid transparent; }
    .card.warn { border-left-color: #e67e22; } /* Orange for Paused */
    .card.safe { border-left-color: #27ae60; } /* Green for Safe */
    .card.cancelled { border-left-color: #c0392b; opacity: 0.7; } /* Red for Cancelled */

    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .fname { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .fsize { background: #eee; padding: 2px 5px; border-radius: 4px; font-size: 10px; color: #555; }
    .status-msg { font-size: 11px; color: #666; display: block; margin-bottom: 8px; }

    /* Action Buttons */
    .actions { display: flex; gap: 5px; }
    .btn { flex: 1; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
    
    /* CANCEL BUTTON STYLE */
    .btn-cancel { background: #fadbd8; color: #c0392b; }
    .btn-cancel:hover { background: #f5b7b1; }
    
    /* KEEP BUTTON STYLE */
    .btn-keep { background: #d6eaf8; color: #2980b9; }
    .btn-keep:hover { background: #aed6f1; }

    /* Footer */
    .footer { text-align: center; padding: 10px; color: #999; font-size: 11px; cursor: pointer; }
    .footer:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🛡️ DDAS Watchdog</h2>
  </div>

  <div class="stats">
    <div class="stat-box">
      <span class="stat-num" id="dup-count">0</span>
      <span class="stat-label">Duplicates</span>
    </div>
    <div class="stat-box">
      <span class="stat-num" id="saved-mem">0 MB</span>
      <span class="stat-label">Memory Saved</span>
    </div>
  </div>

  <div id="list">
    </div>

  <div class="footer" id="clear">Clear History</div>

  <script src="popup.js"></script>
</body>
</html>
