<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DDAS</title>

  <style>
    body {
      width: 230px;
      margin: 0;
      padding: 10px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #222;
    }

    .header {
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 6px;
  text-align: center;
}


    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric {
      font-size: 12px;
      color: #333;
      margin: 6px 0;
    }

    .metric span {
      font-weight: 600;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 6px 0;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f8f8f8;
      cursor: pointer;
    }

    button:hover {
      background: #efefef;
    }

    input[type="checkbox"] {
      cursor: pointer;
    }
    .header-box {
  padding: 8px 6px;
  margin-bottom: 6px;
  border-radius: 6px;
  background: linear-gradient(
    180deg,
    #e1e0e0 24%,
    #e5e2e2 76%
  );
  border: 1px solid #e6e6e6;
  text-align: center;
}

.title h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.header {
  margin-top: 2px;
  font-size: 11.5px;
  font-weight: 500;
  color: #555;
}

  </style>
</head>

<body>
  <div class="header-box">
  <div class="title">
    <h1>DDAS</h1>
  </div>
  <div class="header">Data Download Duplicate Alert System</div>
</div>

<!-- <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 6px 0 8px;"> -->



  <div class="row">
    <span>Duplicate detection</span>
    <input type="checkbox" id="toggle">
  </div>

  <div class="metric">
    Storage saved: <span id="storageSaved">0 MB</span>
  </div>

  <button id="viewDuplicates">
    View duplicate files
  </button>

</body>
</html>
